<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小游戏厅</title>
<link rel="stylesheet" href="shared/style.css">
<style>
  .hero { margin:8px 0 14px; }
  .hero h1 { font-size:26px; margin:4px 0; }
  label { display:block; font-size:14px; color:var(--muted); margin:10px 0 4px; }
  .err { color:var(--bad); font-size:14px; min-height:20px; margin-top:8px; }
  #code { font-size:26px; letter-spacing:.3em; text-align:center; }
  .btn { width:100%; padding:12px 16px; border:0; border-radius:10px; background:var(--accent); color:#fff; font:inherit; font-weight:600; cursor:pointer; margin-top:12px; touch-action:manipulation; }
  .btn.ghost { background:transparent; color:var(--muted); border:1px solid var(--line); font-weight:400; }
  .link { background:none; border:0; color:var(--accent); font:inherit; font-size:14px; cursor:pointer; padding:6px 0; }
  .bar { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:4px 0 10px; }
  .bar .t { font-weight:700; font-size:18px; }
  .badge { display:inline-block; margin-left:6px; padding:1px 8px; border-radius:999px; font-size:12px; color:var(--accent); background:rgba(47,111,237,.12); }
  .badge.host { color:var(--warn); background:rgba(199,122,0,.14); }
  .badge.me { color:var(--ok); background:rgba(26,155,82,.14); }
  ul.roster { list-style:none; margin:0; padding:0; }
  ul.roster li { padding:8px 0; border-bottom:1px solid var(--line); display:flex; align-items:center; }
  ul.roster li:last-child { border-bottom:0; }
  ul.roster .nm { font-weight:600; }
  .who { display:block; font-size:13px; color:var(--warn); }
  .who.guest { color:var(--accent); }
  .pills { display:flex; gap:8px; }
  .pill { min-height:44px; padding:8px 16px; border:0; border-radius:999px; background:var(--card); color:var(--text); font:inherit; font-weight:600; box-shadow:0 1px 3px rgba(0,0,0,.12); cursor:pointer; touch-action:manipulation; }
  .pill.main { background:var(--accent); color:#fff; }
  .grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:18px 6px; margin:14px 0 10px; }
  button.game { display:flex; flex-direction:column; align-items:center; gap:6px; min-width:0; padding:0; border:0; background:none; color:var(--text); font:inherit; cursor:pointer; touch-action:manipulation; }
  button.game .icon { display:flex; align-items:center; justify-content:center; width:64px; height:64px; border-radius:16px; font-size:34px; line-height:1; box-shadow:0 3px 8px rgba(0,0,0,.18); }
  button.game .name { font-size:12px; white-space:nowrap; }
  button.game:not(:disabled):active .icon { transform:scale(.92); }
  button.game:disabled { opacity:.45; filter:grayscale(.7); cursor:not-allowed; }
  dialog.sheet { position:fixed; inset:auto 0 0 0; width:100%; max-width:480px; max-height:85%; margin:0 auto; padding:0; border:0; border-radius:22px 22px 0 0; background:var(--card); color:var(--text); overflow:auto; }
  dialog.sheet::backdrop { background:rgba(0,0,0,.45); }
  .sheet-body { padding:10px 18px 24px; }
  .sheet .qr { color:#1d2433; text-align:center; }
  .grab { width:40px; height:4px; border-radius:4px; background:var(--line); margin:0 auto 4px; }
  .sheet-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; font-weight:700; }
  .sheet-head .link { min-width:44px; min-height:44px; }
  .stage { margin:0 -16px; }
  .frame { display:block; width:100%; border:0; min-height:300px; background:transparent; }
  .mirror { padding:0 16px; }
  .mirror-note { text-align:center; }
</style>
</head>
<body>
<main>
  <!-- 1. 输入房间号 -->
  <section id="join">
    <div class="hero">
      <h1>🎮 小游戏厅</h1>
      <div class="muted">输入同一个 4 位房间号，就能和朋友联机。第一个进入的人是房主，由房主选游戏。</div>
    </div>
    <form class="card" id="joinForm" novalidate>
      <label for="name">你的昵称</label>
      <input type="text" id="name" maxlength="12" autocomplete="off" placeholder="例如：小明">
      <label for="code">房间号（4 位数字）</label>
      <input type="text" id="code" inputmode="numeric" pattern="\d{4}" maxlength="4" autocomplete="off" placeholder="0000">
      <button type="button" class="link" id="rand">随机一个房间号</button>
      <div class="err" id="joinErr"></div>
      <button class="btn" type="submit" id="joinBtn">进入房间</button>
    </form>
  </section>

  <!-- 2. 连接中 -->
  <section id="connecting" hidden>
    <div class="card" style="text-align:center">
      <div id="connMsg" style="font-weight:600">正在寻找房间…</div>
      <div class="muted">最多约 3 秒；没人时你会成为房主</div>
    </div>
  </section>

  <!-- 3. 大厅 -->
  <section id="lobby" hidden>
    <div class="bar">
      <div>
        <div class="t">房间 <span id="lbCode"></span></div>
        <span class="who" id="lbRole"></span>
      </div>
      <div class="pills">
        <button class="pill" id="openRoster" type="button" aria-haspopup="dialog">👥 <span id="lbCount"></span></button>
        <button class="pill main" id="openInvite" type="button" aria-haspopup="dialog">邀请</button>
      </div>
    </div>
    <div class="muted" id="lbHint" style="margin:6px 2px 10px"></div>
    <div class="grid" id="games"></div>
    <button class="btn ghost" id="leave1" type="button">离开房间</button>

    <dialog class="sheet" id="rosterSheet" aria-label="房间成员">
      <div class="sheet-body">
        <div class="grab"></div>
        <div class="sheet-head"><span>房间成员（<span id="rosterCount"></span>）</span><button class="link" type="button" data-close>关闭</button></div>
        <ul class="roster" id="lbRoster"></ul>
      </div>
    </dialog>
    <dialog class="sheet" id="inviteSheet" aria-label="邀请朋友">
      <div class="sheet-body">
        <div class="grab"></div>
        <div class="sheet-head"><span>邀请朋友</span><button class="link" type="button" data-close>关闭</button></div>
        <div class="muted">让朋友扫码，或输入房间号加入：</div>
        <div class="qr" id="qr"></div>
        <div class="row">
          <input type="text" id="link" readonly>
          <button class="small" id="copy" type="button">复制</button>
        </div>
      </div>
    </dialog>
  </section>

  <!-- 4. 游戏中 -->
  <section id="play" hidden>
    <div class="bar">
      <div>
        <div class="t" id="pyGame"></div>
        <div class="muted"><span id="pyRole"></span> · <span id="pyWho"></span></div>
      </div>
      <div>
        <button class="small" id="endGame" type="button" hidden>结束游戏</button>
      </div>
    </div>
    <div class="muted" id="pyHint"></div>
    <div class="stage" id="stage"></div>
    <button class="btn ghost" id="leave2" type="button">离开房间</button>
  </section>
</main>
<script type="module" src="shared/hub.js"></script>
</body>
</html>
