<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小游戏厅</title>
<link rel="stylesheet" href="shared/style.css">
<style>
  .hero { margin:8px 0 18px; }
  .hero h1 { font-size:26px; margin:4px 0; }
  .grid { display:grid; gap:12px; }
  a.game { display:flex; align-items:center; gap:14px; padding:16px; background:var(--card);
    border-radius:14px; text-decoration:none; color:var(--text);
    box-shadow:0 1px 3px rgba(0,0,0,.08); border:2px solid transparent; }
  a.game:active { border-color:var(--accent); }
  a.game .icon { font-size:34px; line-height:1; min-width:64px; text-align:center; }
  a.game .info { flex:1; min-width:0; }
  a.game .name { font-weight:700; font-size:18px; }
  a.game .desc { color:var(--muted); font-size:14px; }
  a.game .tag { display:inline-block; margin-top:4px; padding:1px 8px; border-radius:999px;
    font-size:12px; color:var(--accent); background:rgba(47,111,237,.12); }
  a.game .go { color:var(--muted); font-size:22px; }
  .soon { padding:16px; text-align:center; color:var(--muted); font-size:14px;
    border:2px dashed var(--line); border-radius:14px; }
  .steps { margin:18px 0 0; padding-left:20px; }
</style>
</head>
<body>
<main>
  <div class="hero">
    <h1>🎮 小游戏厅</h1>
    <div class="muted">选一个游戏，把二维码给朋友扫一下，就能联机对战。</div>
  </div>

  <div class="grid" id="games"></div>

  <ol class="muted steps">
    <li>点开一个游戏，页面会出现二维码</li>
    <li>让对方用手机相机扫码，自动加入</li>
    <li>两台设备直接连接，不经过游戏服务器</li>
  </ol>
</main>

<script>
// 新增游戏：在 games/ 下建一个文件夹，然后在这里加一项即可
const GAMES = [
  {id: 'rps', icon: '✊✌️✋', name: '剪刀石头布', desc: '经典猜拳，双方同时揭晓，防偷看', players: '2 人', path: 'games/rps/'},
  {id: 'connect-four', icon: '🔴🟡', name: '四子棋', desc: '轮流投子，横竖斜连成 4 个就赢', players: '2 人', path: 'games/connect-four/'}
]

const box = document.getElementById('games')
for (const g of GAMES) {
  const a = document.createElement('a')
  a.className = 'game'
  // 保留当前网址里的 ?s=xxx（切换信令通道的参数）
  a.href = g.path + location.search
  a.innerHTML = `<div class="icon"></div><div class="info"><div class="name"></div><div class="desc"></div><span class="tag"></span></div><div class="go">›</div>`
  a.querySelector('.icon').textContent = g.icon
  a.querySelector('.name').textContent = g.name
  a.querySelector('.desc').textContent = g.desc
  a.querySelector('.tag').textContent = g.players
  box.appendChild(a)
}
const soon = document.createElement('div')
soon.className = 'soon'
soon.textContent = '更多游戏开发中…'
box.appendChild(soon)
</script>
</body>
</html>
