<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>猜英雄</title>
<link rel="stylesheet" href="../../shared/style.css">
<style>
  /* 配色：靛蓝夜（案卷）、朱砂（印章/猜测）、金（分数）。页面底色沿用大厅，保证内嵌时没有色差。 */
  :root {
    --ink:#1d2347; --seal:#c8372d; --gold:#e3b54a;
    --ask:#3441b5; --ask-t:#fff;
    --soft:rgba(128,128,128,.13);
    --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#1a1f40; --seal:#e5564b; --ask:#8e9cff; --ask-t:#12152b; }
  }
  button { font:inherit; touch-action:manipulation; }
  :focus-visible { outline:2px solid var(--ask); outline-offset:2px; }
  #guessForm :focus-visible { outline-color:var(--seal); }

  .role { font-size:13px; color:var(--muted); margin:0 2px 10px; }
  .role:empty { display:none; }
  .wait { text-align:center; color:var(--muted); padding:28px 16px; }

  /* ---------- 案卷：回合、倒计时、神秘英雄、比分 ---------- */
  .case { background:var(--ink); color:#e9ecf8; border-radius:18px; padding:16px; margin-bottom:14px; }
  .case-top { display:flex; justify-content:space-between; align-items:baseline; gap:10px; font-size:14px; }
  .case-top #roundLine { font-weight:600; }
  .case-top #timeLine { color:#a9b1d6; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .tbar { height:4px; border-radius:2px; background:rgba(255,255,255,.14); margin:10px 0 14px; overflow:hidden; }
  .tbar i { display:block; height:100%; width:calc(var(--p,1) * 100%); background:var(--gold); transition:width 1s linear; }
  .tbar.low i { background:#ff7a6e; }

  .mystery { display:flex; align-items:center; gap:14px; padding-bottom:4px; }
  .mystery .box { flex:none; width:68px; height:68px; display:grid; place-items:center; border:2px dashed rgba(255,255,255,.35);
    border-radius:10px; font:700 40px/1 var(--serif); color:var(--gold); }
  .mystery b { display:block; font:700 22px/1.25 var(--serif); }
  .mystery span { font-size:13px; color:#a9b1d6; }

  .reveal { text-align:center; padding:8px 0 4px; }
  .reveal .big { font-size:16px; font-weight:600; word-break:break-all; }
  .reveal .big.ok { color:var(--gold); }
  .seal { display:inline-block; margin:14px 0 10px; padding:10px 22px 10px calc(22px + .14em); background:var(--seal); color:#fff3e6;
    font:800 34px/1.15 var(--serif); letter-spacing:.14em; border-radius:6px; word-break:break-all;
    box-shadow:inset 0 0 0 2px rgba(255,243,230,.55); transform:rotate(-3deg); }
  .seal.stamp { animation:stamp .42s cubic-bezier(.2,.9,.3,1.2) both; }
  @keyframes stamp {
    0% { transform:scale(1.8) rotate(-9deg); opacity:0; }
    60% { opacity:1; }
    100% { transform:scale(1) rotate(-3deg); opacity:1; }
  }
  .reveal .sub { font-size:14px; color:#a9b1d6; }
  .go { width:100%; min-height:46px; margin-top:14px; border:0; border-radius:12px; background:var(--gold); color:#1d2347; font-weight:700; cursor:pointer; }
  .wait-next { margin-top:12px; font-size:14px; color:#a9b1d6; }

  .players { display:flex; flex-wrap:wrap; gap:6px; margin-top:14px; padding-top:12px; border-top:1px solid rgba(255,255,255,.12); }
  .players:empty { display:none; }
  .chip { display:inline-flex; align-items:center; gap:6px; padding:3px 4px 3px 11px; border-radius:999px; font-size:13px;
    background:rgba(255,255,255,.08); word-break:break-all; }
  .chip.me { box-shadow:inset 0 0 0 1px var(--gold); }
  .chip b { min-width:22px; padding:1px 6px; border-radius:999px; background:rgba(0,0,0,.28); color:var(--gold); text-align:center; font-variant-numeric:tabular-nums; }
  .skip { margin:6px 0 -6px; min-height:44px; padding:0; border:0; background:none; color:#a9b1d6; font-size:13px; text-decoration:underline; cursor:pointer; }

  /* ---------- 输入区：问 AI / 猜英雄 ---------- */
  .composer { background:var(--card); border-radius:18px; padding:6px 14px 14px; margin-bottom:18px; box-shadow:0 1px 2px rgba(0,0,0,.06); }
  .tabs { display:flex; gap:4px; margin:8px 0 12px; padding:4px; border-radius:12px; background:var(--soft); }
  .tabs button { flex:1; min-height:40px; border:0; border-radius:9px; background:transparent; color:var(--muted); font-weight:600; cursor:pointer; }
  .tabs button[aria-selected=true] { background:var(--card); box-shadow:0 1px 3px rgba(0,0,0,.14); }
  #tabAsk[aria-selected=true] { color:var(--ask); }
  #tabGuess[aria-selected=true] { color:var(--seal); }
  .composer input[type=text] { font-size:16px; min-height:46px; border-radius:12px; }
  .composer .row { align-items:stretch; }
  .send { flex:none; min-height:46px; padding:0 20px; border:0; border-radius:12px; font-weight:700; cursor:pointer; white-space:nowrap; }
  .send:disabled { opacity:.5; cursor:not-allowed; }
  .send.ask { background:var(--ask); color:var(--ask-t); }
  .send.guess { background:var(--seal); color:#fff; }
  .msg { min-height:20px; margin-top:8px; font-size:14px; }
  .msg:empty { min-height:0; margin:0; }
  .msg.bad { color:var(--bad); } .msg.warn { color:var(--warn); } .msg.ok { color:var(--ok); }

  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chips:empty { display:none; }
  .composer .chips { margin-top:10px; }
  button.pick { min-height:40px; padding:0 14px; border:1px solid var(--line); border-radius:999px; background:transparent; color:var(--text); font-size:14px; cursor:pointer; }
  details.all summary { min-height:44px; display:flex; align-items:center; color:var(--muted); font-size:14px; cursor:pointer; }
  details.all .chips { padding-bottom:2px; }

  /* ---------- 记录：聊天气泡，最新的在最上面（紧挨着输入框） ---------- */
  .feed { display:flex; flex-direction:column; gap:18px; margin-bottom:18px; }
  .entry { display:flex; flex-direction:column; gap:6px; }
  .qwrap { display:flex; flex-direction:column; align-items:flex-start; max-width:88%; }
  .qwrap.mine { align-self:flex-end; align-items:flex-end; }
  .who { margin:0 6px 2px; font-size:12px; color:var(--muted); }
  .q { padding:9px 14px; border-radius:16px 16px 16px 4px; border:1px solid var(--line); background:var(--card); word-break:break-word; }
  .qwrap.mine .q { border:0; background:var(--ask); color:var(--ask-t); border-radius:16px 16px 4px 16px; }
  .arow { display:flex; align-items:flex-start; gap:8px; }
  .av { flex:none; width:28px; height:28px; display:grid; place-items:center; border-radius:50%; background:var(--ink); color:var(--gold); font:700 14px/1 var(--serif); }
  .a { max-width:calc(100% - 36px); padding:9px 14px; border-radius:4px 16px 16px 16px; background:var(--soft); white-space:pre-wrap; word-break:break-word; }
  .a.err { color:var(--warn); }
  .dots i { display:inline-block; width:6px; height:6px; margin-right:4px; border-radius:50%; background:var(--muted); animation:blink 1.2s infinite both; }
  .dots i:nth-child(2) { animation-delay:.2s; } .dots i:nth-child(3) { animation-delay:.4s; margin-right:0; }
  @keyframes blink { 0%,80%,100% { opacity:.25; } 40% { opacity:1; } }
  .entry.guess { align-items:center; }
  .gpill { display:inline-flex; align-items:center; gap:8px; padding:6px 14px; border:1px solid var(--line); border-radius:999px; font-size:14px; word-break:break-all; }
  .gpill .x { color:var(--seal); font-weight:700; white-space:nowrap; }

  .rules { margin:0 2px 28px; color:var(--muted); font-size:14px; }
  .rules summary { min-height:44px; display:flex; align-items:center; cursor:pointer; }
  .rules p { margin:0 0 8px; }

  @media (prefers-reduced-motion: reduce) {
    .seal.stamp { animation:none; }
    .dots i { animation:none; opacity:.6; }
    .tbar i { transition:none; }
  }
</style>
</head>
<body>
<main>
  <a class="back" id="back" href="../../">← 返回游戏厅</a>
  <h1>猜英雄</h1>

  <div id="lobby"></div>
  <div class="role" id="roleLine"></div>

  <div class="card wait" id="stateCard" hidden>
    <div id="stateText"></div>
  </div>

  <!-- 案卷：回合 / 倒计时 / 神秘英雄 or 揭晓 / 比分 -->
  <section class="case" id="caseCard" hidden>
    <div class="case-top"><span id="roundLine"></span><span id="timeLine"></span></div>
    <div class="tbar" id="tbar" hidden><i></i></div>

    <div class="mystery" id="mystery">
      <div class="box" aria-hidden="true">？</div>
      <div><b>神秘英雄</b><span>AI 知道答案，但不会说出名字</span></div>
    </div>

    <div class="reveal" id="resultCard" hidden>
      <div class="big" id="resultTitle"></div>
      <div class="seal" id="resultAns"></div>
      <div class="sub" id="resultSub"></div>
      <div class="wait-next" id="nextInfo"></div>
      <button class="go" type="button" id="nextBtn"></button>
      <div class="wait-next" id="waitNext" hidden>等待主机开始下一个…</div>
    </div>

    <div class="players" id="players"></div>
    <button class="skip" type="button" id="skipBtn" hidden>公布答案，跳过这个英雄</button>
  </section>

  <!-- 输入区 -->
  <section class="composer" id="composer" hidden>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tabAsk" aria-selected="true">问 AI</button>
      <button type="button" role="tab" id="tabGuess" aria-selected="false">猜英雄</button>
    </div>

    <form id="askForm" novalidate>
      <div class="row">
        <input type="text" id="ask" lang="zh-CN" maxlength="60" autocomplete="off" autocapitalize="off"
               spellcheck="false" enterkeyhint="send" placeholder="问点什么，例如：他会飞吗？" aria-label="向 AI 提问">
        <button class="send ask" type="submit" id="askBtn">提问</button>
      </div>
      <div class="chips" id="quick"></div>
      <div class="msg" id="askMsg" aria-live="polite"></div>
    </form>

    <form id="guessForm" novalidate hidden>
      <div class="row">
        <input type="text" id="guess" lang="zh-CN" maxlength="12" autocomplete="off" autocapitalize="off"
               spellcheck="false" enterkeyhint="send" placeholder="输入英雄名，先猜对的人得 1 分" aria-label="猜英雄名">
        <button class="send guess" type="submit" id="guessBtn">猜！</button>
      </div>
      <div class="chips" id="sugg"></div>
      <div class="msg" id="guessMsg" aria-live="polite"></div>
      <details class="all">
        <summary id="allSummary">查看全部英雄名单</summary>
        <div class="chips" id="allHeroes"></div>
      </details>
    </form>
  </section>

  <!-- 记录 -->
  <div class="feed" id="logCard" hidden>
    <div id="log" class="feed" style="margin:0"></div>
  </div>

  <details class="rules">
    <summary>玩法说明</summary>
    <p>房主的页面随机藏一个《王者荣耀》英雄。向 AI 提问来推理，它什么都能答，唯独不会直接说出名字。</p>
    <p>想好了就报英雄名，先报对的人得 1 分，先到目标分数的赢。所有人的问答和猜错的英雄大家都看得到。</p>
    <p>猜错后要等几秒才能再猜；每个英雄有时间和提问次数限制，到点没人猜出来就公布答案。只有你一个人时就是单人测试。AI 偶尔会答错，尤其是新英雄。</p>
  </details>
</main>

<script type="module">
import {CONFIG} from './config.js'
import {createLobby} from '../../shared/lobby.js'
import {HERO_LIST, MAX_LOG, MAX_ANS_LEN, findHero, suggest, pickHero, cleanQuestion, questionError,
        isId, pickLeader, newSid, parseQuestionMsg, parseGuessMsg, parseRes, parseState, isNewer} from './logic.js'

const $ = id => document.getElementById(id)
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n }
$('back').href = '../../' + location.search   // 独立打开时，返回时保留 ?s= 参数

// =====================================================================================
// 玩法与联机方式
//   · 房主就是"主机"：抽英雄、收提问和猜测、请求 AI（经 Cloudflare Worker）、判对错、算分。
//   · 隐藏的英雄只在主机页面的内存里；其他人只有在这一题公布答案之后才会收到它的名字。
//   · 公共状态每次都发完整的一份并带版本号：晚加入的人、丢了消息的人，收到下一条就追上了。
// =====================================================================================

const blank = () => ({sid: '', v: 0, r: 0, rd: 0, ph: 'prep', tg: CONFIG.TARGET_SCORE, qn: 0, tl: 0, ans: '', by: -1, note: '',
                      ids: [], sc: [], L: []})
const P = blank()
const resetPublic = () => Object.assign(P, blank())
const stateMsg = () => ({t: 'st', sid: P.sid, v: P.v, r: P.r, rd: P.rd, ph: P.ph, tg: P.tg, qn: P.qn, tl: leftSecs(), ans: P.ans,
                         by: P.by, note: P.note, ids: P.ids, sc: P.sc, L: P.L})

// 只有主机用的私有状态
const H = {gen: 0, hero: null, used: new Set(), seq: 0, deadline: 0, timer: 0,
           queue: [], busy: false, pend: new Set(), lastQ: new Map(), lock: new Map()}

// 每个人自己的界面状态
const U = {seq: 0, recvAt: 0, lastRd: -1, lastR: -1, lockUntil: 0, mode: 'ask', stampKey: '',
           qBusy: false, qId: -1, qTimer: 0, qMsg: '', qCls: '',
           gBusy: false, gId: -1, gTimer: 0, gMsg: '', gCls: ''}

let room = null, act = null, selfId = null, leader = null, booted = false
const peers = new Set()
const isHost = () => !!selfId && leader === selfId
const nameOf = id => (room && room.names && room.names[id]) || (id === selfId ? '我' : '玩家' + String(id).slice(-4))
const present = () => [selfId, ...peers]

function leftSecs() {
  if (isHost()) return H.deadline ? Math.max(0, Math.ceil((H.deadline - Date.now()) / 1000)) : 0
  return Math.max(0, Math.ceil(P.tl - (Date.now() - U.recvAt) / 1000))
}

function sendTo(target, msg) {
  if (!act) return
  try { const p = act.send(msg, target ? {target} : undefined); if (p && p.catch) p.catch(() => {}) } catch {}
}
function broadcast() { if (peers.size) sendTo(null, stateMsg()) }
function bump() { P.v++; broadcast(); render() }

// ---------- 向 Worker 问 AI（只有主机会调用） ----------
async function askHero(job) {
  const pairs = []
  for (const e of P.L) if (e[1] === 'q' && e[5] === 1 && e[4] && e[0] < job.seq) pairs.push([e[3], e[4]])
  const history = pairs.slice(-CONFIG.HISTORY_PAIRS)
  const ctrl = new AbortController()
  const timer = setTimeout(() => ctrl.abort(), CONFIG.REQUEST_TIMEOUT_MS)
  try {
    const res = await fetch(CONFIG.HERO_URL, {
      method: 'POST', headers: {'Content-Type': 'application/json', 'Accept': 'application/json'}, signal: ctrl.signal,
      body: JSON.stringify({hero: job.hero.n, aliases: job.hero.a, question: job.q, history})
    })
    if (!res.ok) { const e = new Error('HTTP ' + res.status); e.status = res.status; throw e }
    const json = await res.json()
    const text = json && typeof json.answer === 'string' ? json.answer.trim() : ''
    if (!text) throw Object.assign(new Error('empty'), {status: 502})
    return text.slice(0, MAX_ANS_LEN)
  } finally { clearTimeout(timer) }
}

function explain(e) {
  if (e && e.name === 'AbortError') return '超时'
  const s = e && e.status
  if (s === 429) return '额度用完或限速'
  if (s === 500) return 'Worker 没配置智谱 Key'
  if (s === 422 || s === 404 || s === 405) return 'Worker 还是旧代码，需要重新部署'
  if (s === 403) return '来源不被允许'
  if (s === 502) return 'AI 没给出回答'
  if (e instanceof TypeError) return '网络不通'
  return String(e && e.message || e).slice(0, 20)
}

// =====================================================================================
// 主机：开局、收提问、判猜测
// =====================================================================================
function ensurePlayer(id) {
  let i = P.ids.indexOf(id)
  if (i < 0) { P.ids.push(id); P.sc.push(0); i = P.ids.length - 1 }
  return i
}

function pushLog(entry) {
  P.L.push(entry)
  while (P.L.length > MAX_LOG) P.L.shift()
}

function clearTimers() { clearTimeout(H.timer); H.timer = 0 }

// 新的一局（分数清零）
function newGame() {
  if (!isHost()) return
  clearTimers(); H.gen++
  const keep = {sid: P.sid, v: P.v, r: P.r + 1}
  resetPublic(); Object.assign(P, keep)
  H.used.clear()
  present().forEach(ensurePlayer)
  startRound()
}

// 新的一个英雄
function startRound() {
  if (!isHost()) return
  clearTimers(); H.gen++
  H.queue = []; H.busy = false; H.pend.clear(); H.lock.clear(); H.lastQ.clear(); H.seq = 0
  H.hero = pickHero(H.used)
  H.used.add(H.hero.n)
  P.rd++; P.ph = 'play'; P.L = []; P.qn = 0; P.ans = ''; P.by = -1; P.note = ''
  H.deadline = Date.now() + CONFIG.ROUND_SECONDS * 1000
  H.timer = setTimeout(() => endRound(-1, '时间到了，没有人猜出来'), CONFIG.ROUND_SECONDS * 1000)
  bump()
}

// 这一题结束：winner 是猜对的人（序号），-1 表示没人猜对
function endRound(winner, why) {
  if (!isHost() || P.ph !== 'play') return
  clearTimers(); H.gen++
  H.queue = []; H.busy = false; H.pend.clear()
  for (const e of P.L) if (e[5] === 0) { e[4] = '（这一题已经结束）'; e[5] = 2 }
  P.ans = H.hero.n; P.by = winner; P.note = winner >= 0 ? '' : (why || '')
  if (winner >= 0) P.sc[winner]++
  if (winner >= 0 && P.sc[winner] >= P.tg) {
    P.ph = 'over'; H.deadline = 0
  } else {
    P.ph = 'reveal'
    H.deadline = Date.now() + CONFIG.NEXT_DELAY_SECONDS * 1000
    H.timer = setTimeout(() => { if (isHost() && P.ph === 'reveal') startRound() }, CONFIG.NEXT_DELAY_SECONDS * 1000)
  }
  bump()
}

function deliverRes(to, res) {
  if (to === selfId) onRes(parseRes(res))
  else sendTo(to, res)
}

function submitQuestion(from, id, q) {
  const reject = m => deliverRes(from, {t: 'res', id, k: 'q', ok: false, m, lk: 0})
  if (P.ph !== 'play') return reject('现在不能提问')
  if (H.pend.has(from)) return reject('AI 还在回答你的上一个问题，稍等一下')
  const now = Date.now()
  if (now - (H.lastQ.get(from) || 0) < CONFIG.QUESTION_GAP_MS) return reject('问得太快啦，稍等一下')
  if (P.qn >= CONFIG.MAX_QUESTIONS) return reject('这个英雄的提问次数用完了，只能直接猜了')
  const idx = ensurePlayer(from)
  H.lastQ.set(from, now)
  H.pend.add(from)
  P.qn++
  const seq = ++H.seq
  pushLog([seq, 'q', idx, q, '', 0])
  H.queue.push({seq, from, q, hero: H.hero, gen: H.gen})
  deliverRes(from, {t: 'res', id, k: 'q', ok: true, m: '', lk: 0})
  bump()
  pump()
}

// AI 一次只处理一个问题（免费模型同时只允许一个请求），排队按顺序来
async function pump() {
  if (H.busy || !H.queue.length || P.ph !== 'play' || !isHost()) return
  const job = H.queue.shift()
  if (job.gen !== H.gen) return pump()
  H.busy = true
  let ans = '', st = 1
  try { ans = await askHero(job) }
  catch (e) { st = 2; ans = `⚠️ AI 没有回答（${explain(e)}），可以再问一次` }
  if (job.gen !== H.gen) return
  H.busy = false
  H.pend.delete(job.from)
  const e = P.L.find(x => x[0] === job.seq)
  if (e) { e[4] = ans; e[5] = st }
  if (st === 2) P.qn = Math.max(0, P.qn - 1)
  bump()
  pump()
}

function submitGuess(from, id, text) {
  const reject = (m, lk = 0) => deliverRes(from, {t: 'res', id, k: 'g', ok: false, m, lk})
  if (P.ph !== 'play') return reject('现在不能猜')
  const now = Date.now()
  const lockUntil = H.lock.get(from) || 0
  if (lockUntil > now) { const s = Math.ceil((lockUntil - now) / 1000); return reject(`猜错后要等一等，还有 ${s} 秒`, s) }
  const h = findHero(text)
  if (!h) return reject('没找到这个英雄，点下面的提示选一个，或检查有没有错别字')
  if (P.L.some(e => e[1] === 'g' && e[3] === h.n)) return reject(`「${h.n}」已经有人猜过了，不是它`)
  const idx = ensurePlayer(from)
  if (h.n === H.hero.n) {
    deliverRes(from, {t: 'res', id, k: 'g', ok: true, m: '🎉 猜对了！', lk: 0})
    endRound(idx)
    return
  }
  pushLog([++H.seq, 'g', idx, h.n, '', 1])
  H.lock.set(from, now + CONFIG.WRONG_LOCK_SECONDS * 1000)
  deliverRes(from, {t: 'res', id, k: 'g', ok: true, m: `不是「${h.n}」`, lk: CONFIG.WRONG_LOCK_SECONDS})
  bump()
}

// =====================================================================================
// 收到的联机消息（一律当作不可信数据）
// =====================================================================================
function onMsg(d, from) {
  if (!d || typeof d !== 'object' || !isId(from) || from === selfId || !selfId) return
  if (isHost()) {
    if (!peers.has(from)) return
    if (d.t === 'q') { const m = parseQuestionMsg(d); if (m) submitQuestion(from, m.id, m.q) }
    else if (d.t === 'g') { const m = parseGuessMsg(d); if (m) submitGuess(from, m.id, m.g) }
    else if (d.t === 'hi') { if (P.sid) sendTo(from, stateMsg()) }
  } else if (from === leader) {
    if (d.t === 'st') {
      const s = parseState(d)
      if (s && isNewer(P, s)) { Object.assign(P, s); U.recvAt = Date.now(); render() }
    } else if (d.t === 'res') onRes(parseRes(d))
  }
}

function onRes(res) {
  if (!res) return
  if (res.k === 'q') {
    if (res.id !== U.qId) return
    clearTimeout(U.qTimer); U.qBusy = false; U.qId = -1
    if (res.ok) { U.qMsg = ''; U.qCls = ''; $('ask').value = '' }
    else { U.qMsg = res.m; U.qCls = 'warn' }
  } else {
    if (res.id !== U.gId) return
    clearTimeout(U.gTimer); U.gBusy = false; U.gId = -1
    if (res.lk) U.lockUntil = Date.now() + res.lk * 1000
    if (res.ok) { $('guess').value = ''; renderSugg() }
    U.gMsg = res.m; U.gCls = res.ok ? (res.m.startsWith('🎉') ? 'ok' : 'warn') : 'warn'
  }
  render()
}

// =====================================================================================
// 谁是主机：房主。房主换人（或有人进出）时重新确认
// =====================================================================================
function resetLocal() {
  clearTimeout(U.qTimer); clearTimeout(U.gTimer)
  U.qBusy = U.gBusy = false; U.qId = U.gId = -1; U.lockUntil = 0
  U.qMsg = U.qCls = U.gMsg = U.gCls = ''
}

function syncLeader() {
  if (!selfId) return
  const nl = pickLeader(room && room.host, selfId, peers)
  if (nl === leader) return
  leader = nl
  clearTimers(); H.gen++; H.queue = []; H.busy = false; H.pend.clear(); H.deadline = 0
  resetLocal()
  resetPublic()
  if (leader === selfId) { P.sid = newSid(); newGame() }       // 我成了主机：新开一局（新的 sid 让别人知道换了主机）
  else if (leader) sendTo(leader, {t: 'hi'})                   // 我不是主机：向主机要当前状态
  render()
}

function onJoin(id) {
  if (!isId(id) || id === selfId || peers.has(id)) return
  peers.add(id)
  if (!selfId) return
  const was = leader
  syncLeader()
  if (isHost() && was === leader && P.sid) { ensurePlayer(id); bump() }   // 有人中途加入：把当前进度发给他
  else render()
}
function onLeave(id) {
  if (!peers.delete(id)) return
  if (!selfId) return
  const was = leader
  syncLeader()
  if (isHost() && was === leader) { H.lock.delete(id); H.lastQ.delete(id); bump() } else render()
}

function boot() {
  if (booted) return
  booted = true
  syncLeader()
  render()
  setInterval(() => {
    if (isHost()) { if (peers.size && P.sid) sendTo(null, stateMsg()) }
    else if (leader && !P.sid) sendTo(leader, {t: 'hi'})
  }, 5000)
}
function soloBoot() { if (!selfId) { selfId = 'solo-' + Math.random().toString(36).slice(2, 8); boot() } }

// =====================================================================================
// 操作
// =====================================================================================
const meIdx = () => P.ids.indexOf(selfId)
const myPending = () => { const i = meIdx(); return i >= 0 && P.L.some(e => e[1] === 'q' && e[2] === i && e[5] === 0) }

function sendAsk() {
  if (P.ph !== 'play' || U.qBusy || !leader || myPending()) return
  const q = cleanQuestion($('ask').value)
  const bad = questionError(q)
  if (bad) { U.qMsg = bad; U.qCls = 'bad'; return render() }
  const id = ++U.seq
  U.qBusy = true; U.qId = id; U.qMsg = ''; U.qCls = ''
  if (isHost()) submitQuestion(selfId, id, q)
  else {
    sendTo(leader, {t: 'q', id, q})
    U.qTimer = setTimeout(() => {                   // 主机一直不回：放开输入，让玩家可以重试
      if (U.qId !== id) return
      U.qBusy = false; U.qId = -1; U.qMsg = '主机没有响应，请稍后再试'; U.qCls = 'warn'; render()
    }, 15000)
  }
  render()
}

function sendGuess() {
  if (P.ph !== 'play' || U.gBusy || !leader || U.lockUntil > Date.now()) return
  const g = cleanQuestion($('guess').value)
  if (!g) { U.gMsg = '先输入你猜的英雄名'; U.gCls = 'bad'; return render() }
  const id = ++U.seq
  U.gBusy = true; U.gId = id; U.gMsg = ''; U.gCls = ''
  if (isHost()) submitGuess(selfId, id, g)
  else {
    sendTo(leader, {t: 'g', id, g})
    U.gTimer = setTimeout(() => {
      if (U.gId !== id) return
      U.gBusy = false; U.gId = -1; U.gMsg = '主机没有响应，请稍后再试'; U.gCls = 'warn'; render()
    }, 15000)
  }
  render()
}

function setMode(m, focus) {
  if (U.mode !== m) { U.mode = m; render() }
  if (focus) { try { $(m === 'ask' ? 'ask' : 'guess').focus() } catch {} }
}

$('askForm').onsubmit = e => { e.preventDefault(); sendAsk() }
$('guessForm').onsubmit = e => { e.preventDefault(); sendGuess() }
$('tabAsk').onclick = () => setMode('ask', true)
$('tabGuess').onclick = () => setMode('guess', true)
$('guess').oninput = renderSugg
$('skipBtn').onclick = () => { if (isHost()) endRound(-1, '主机公布了答案') }
$('nextBtn').onclick = () => {
  if (!isHost()) return
  if (P.ph === 'reveal') startRound()
  else if (P.ph === 'over') newGame()
}

// =====================================================================================
// 画面
// =====================================================================================
const whoName = idx => P.ids[idx] === selfId ? '你' : nameOf(P.ids[idx])
const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`

function pickHeroName(name) {
  $('guess').value = name
  renderSugg()
}

function renderSugg() {
  const box = $('sugg')
  box.textContent = ''
  for (const n of suggest($('guess').value, 8)) {
    const b = el('button', 'pick', n)
    b.type = 'button'
    b.onclick = () => pickHeroName(n)
    box.appendChild(b)
  }
}

// 常用问题：点一下填进输入框（手机上打字慢）
const QUICK = ['是男性吗？', '是什么定位？', '有位移技能吗？', '有历史原型吗？']
for (const q of QUICK) {
  const b = el('button', 'pick', q)
  b.type = 'button'
  b.onclick = () => { $('ask').value = q; try { $('ask').focus() } catch {} }
  $('quick').appendChild(b)
}

function render() {
  const host = isHost()
  const ph = P.ph
  const inGame = ph !== 'prep'

  // 换了一局或换了一个英雄：清掉上一题的提示和等待
  if (P.r !== U.lastR || P.rd !== U.lastRd) {
    U.lastR = P.r; U.lastRd = P.rd
    resetLocal()
    U.mode = 'ask'
    $('ask').value = ''; $('guess').value = ''; renderSugg()
  }

  let role = '正在连接…'
  if (selfId && leader) {
    if (host) role = peers.size ? '你是主机：英雄和 AI 都由你的页面负责' : '你是主机，目前只有你一个人（单人测试），其他人加入后会一起玩'
    else role = `主机是「${nameOf(leader)}」，英雄和 AI 都由主机负责`
  }
  $('roleLine').textContent = role

  $('stateCard').hidden = inGame
  if (!inGame) $('stateText').textContent = host ? '正在准备…' : !P.sid ? (leader ? '正在等待主机…' : '正在连接…') : '主机正在准备…'

  // 案卷
  const playing = ph === 'play'
  $('caseCard').hidden = !inGame
  $('roundLine').textContent = P.rd ? `第 ${P.rd} 个英雄 · 先到 ${P.tg} 分赢` : ''
  $('tbar').hidden = !playing
  $('mystery').hidden = !playing
  $('skipBtn').hidden = !(host && playing)
  renderPlayers(inGame)

  // 揭晓 / 结束
  const showResult = ph === 'reveal' || ph === 'over'
  $('resultCard').hidden = !showResult
  if (showResult) {
    const winner = P.by >= 0 ? whoName(P.by) : ''
    const t = $('resultTitle')
    if (ph === 'over') { t.textContent = `🏆 ${winner} 先猜对了 ${P.tg} 个英雄，赢了！`; t.className = 'big ok' }
    else if (P.by >= 0) { t.textContent = `🎉 ${winner} 猜对了！`; t.className = 'big ok' }
    else { t.textContent = `⌛ ${P.note || '没有人猜出来'}`; t.className = 'big' }
    $('resultAns').textContent = P.ans
    $('resultSub').textContent = P.by >= 0 ? `${winner} +1 分` : '这个英雄不得分'
    $('nextBtn').hidden = !host
    $('nextBtn').textContent = ph === 'over' ? '再来一局' : '现在开始下一个'
    $('waitNext').hidden = host
    $('waitNext').textContent = ph === 'over' ? '等待主机开始下一局…' : '稍后自动开始下一个英雄…'
    // 揭晓的那一下：答案像印章一样盖下来（每个揭晓只播一次）
    const key = `${P.r}:${P.rd}:${ph}`
    if (key !== U.stampKey) {
      U.stampKey = key
      const s = $('resultAns')
      s.classList.remove('stamp'); void s.offsetWidth; s.classList.add('stamp')
    }
  } else U.stampKey = ''

  // 输入区
  const pending = myPending()
  $('composer').hidden = !playing
  $('tabAsk').setAttribute('aria-selected', String(U.mode === 'ask'))
  $('tabGuess').setAttribute('aria-selected', String(U.mode === 'guess'))
  $('askForm').hidden = U.mode !== 'ask'
  $('guessForm').hidden = U.mode !== 'guess'
  $('quick').hidden = P.L.length > 0
  $('ask').disabled = U.qBusy
  $('askBtn').disabled = U.qBusy || pending || P.qn >= CONFIG.MAX_QUESTIONS
  $('guess').disabled = U.gBusy
  const askNote = pending ? 'AI 正在回答你的上一个问题…' : (P.qn >= CONFIG.MAX_QUESTIONS ? '这个英雄的提问次数用完了，只能直接猜了' : '')
  $('askMsg').textContent = U.qMsg || askNote
  $('askMsg').className = 'msg ' + (U.qMsg ? U.qCls : askNote ? 'warn' : '')
  $('guessMsg').textContent = U.gMsg
  $('guessMsg').className = 'msg ' + U.gCls
  $('allSummary').textContent = `查看全部 ${HERO_LIST.length} 位英雄`

  // 记录
  $('logCard').hidden = !P.L.length
  renderLog()
  updateDynamic()
}

function updateDynamic() {
  const left = leftSecs()
  if (P.ph === 'play') $('timeLine').textContent = `${fmt(left)} · 已问 ${P.qn}/${CONFIG.MAX_QUESTIONS}`
  else $('timeLine').textContent = ''
  const pct = P.ph === 'play' ? Math.max(0, Math.min(1, left / CONFIG.ROUND_SECONDS)) : 0
  $('tbar').style.setProperty('--p', pct)
  $('tbar').classList.toggle('low', pct < 0.2)
  $('nextInfo').textContent = P.ph === 'reveal' ? `${left} 秒后自动开始下一个英雄` : ''
  const lockLeft = Math.ceil((U.lockUntil - Date.now()) / 1000)
  $('guessBtn').disabled = U.gBusy || lockLeft > 0 || P.ph !== 'play'
  $('guessBtn').textContent = lockLeft > 0 ? `等 ${lockLeft} 秒` : '猜！'
}
setInterval(updateDynamic, 1000)

function renderPlayers(show) {
  const box = $('players')
  box.textContent = ''
  if (!show) return
  const here = new Set(present())
  const order = P.ids.map((id, i) => i).filter(i => here.has(P.ids[i]))
  order.sort((a, b) => P.sc[b] - P.sc[a])
  for (const i of order) {
    const id = P.ids[i]
    const chip = el('span', 'chip' + (id === selfId ? ' me' : ''))
    chip.append(`${id === leader ? '👑 ' : ''}${id === selfId ? '你' : nameOf(id)} `)
    chip.appendChild(el('b', null, P.sc[i]))
    box.appendChild(chip)
  }
}

function renderLog() {
  const box = $('log')
  box.textContent = ''
  for (const e of [...P.L].reverse()) {
    const [, kind, who, text, ans, st] = e
    const div = el('div', 'entry' + (kind === 'g' ? ' guess' : ''))
    if (kind === 'g') {
      const pill = el('span', 'gpill', `${whoName(who)} 猜了「${text}」`)
      pill.appendChild(el('span', 'x', '✕ 不是'))
      div.appendChild(pill)
    } else {
      const qw = el('div', 'qwrap' + (P.ids[who] === selfId ? ' mine' : ''))
      qw.append(el('div', 'who', `${whoName(who)} 问`), el('div', 'q', text))
      const row = el('div', 'arow')
      const av = el('span', 'av', '智'); av.setAttribute('aria-hidden', 'true')
      const a = el('div', 'a' + (st === 0 ? ' think' : st === 2 ? ' err' : ''))
      if (st === 0) {
        a.setAttribute('aria-label', 'AI 思考中')
        const dots = el('span', 'dots'); dots.append(el('i'), el('i'), el('i'))
        a.appendChild(dots)
      } else a.textContent = ans
      row.append(av, a)
      div.append(qw, row)
    }
    box.appendChild(div)
  }
}

// 全部英雄名单（点一下填进输入框）
for (const h of HERO_LIST) {
  const b = el('button', 'pick', h.n)
  b.type = 'button'
  b.onclick = () => pickHeroName(h.n)
  $('allHeroes').appendChild(b)
}

// =====================================================================================
// 启动：通过大厅联机。独立打开时自己建房（扫码）；联机库加载不了就当作单人玩
// =====================================================================================
render()
const lobby = await createLobby({
  gameId: 'hero-guess',
  container: $('lobby'),
  maxPlayers: 10,
  onPeerJoin: onJoin,
  onPeerLeave: onLeave,
  setup(r) {
    room = r
    act = r.makeAction('hg')
    act.onMessage((d, meta) => onMsg(d, meta && meta.peerId))
    Promise.resolve(r.getSelf()).then(s => { selfId = s.peerId; boot() }).catch(soloBoot)
  }
})
if (!lobby && !selfId) soloBoot()
</script>
</body>
</html>
