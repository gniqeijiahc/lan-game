<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>中间词</title>
<link rel="stylesheet" href="../../shared/style.css">
<style>
  #guess { font-size:18px; min-height:44px; }
  button.main { min-height:44px; padding:0 20px; border:0; border-radius:10px; background:var(--accent);
    color:#fff; font:inherit; font-weight:600; cursor:pointer; touch-action:manipulation; }
  button.main:disabled { opacity:.55; cursor:not-allowed; }
  button.ghost { min-height:44px; padding:8px 14px; border:1px solid var(--line); border-radius:10px;
    background:transparent; color:var(--text); font:inherit; font-size:14px; cursor:pointer; touch-action:manipulation; }
  button.ghost:disabled { opacity:.45; cursor:not-allowed; }

  .role { font-size:13px; color:var(--muted); margin:0 0 10px; }
  .role:empty { display:none; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { padding:4px 10px; border:1px solid var(--line); border-radius:999px; font-size:13px; word-break:break-all; }
  .chip.me { border-color:var(--accent); color:var(--accent); }
  .chip b { font-variant-numeric:tabular-nums; }
  .topline { display:flex; justify-content:space-between; gap:8px; font-size:14px; color:var(--muted); margin-bottom:8px; }
  .msg { min-height:22px; font-size:14px; margin-top:8px; }
  .msg.bad { color:var(--bad); } .msg.warn { color:var(--warn); } .msg.ok { color:var(--ok); }
  .wait { text-align:center; padding:6px 0; }
  .wait .mine { font-size:22px; font-weight:700; color:var(--accent); margin:4px 0; word-break:break-all; }

  .turn { padding:10px 0; border-bottom:1px solid var(--line); }
  .turn:last-child { border-bottom:0; }
  .turn.new { background:rgba(47,111,237,.08); margin:0 -8px; padding:10px 8px; border-radius:8px; border-bottom-color:transparent; }
  .turn .head { font-size:12px; color:var(--muted); margin-bottom:6px; }
  .turn .words { display:flex; flex-wrap:wrap; gap:6px; }
  .w { padding:4px 10px; border:1px solid var(--line); border-radius:10px; font-size:16px; word-break:break-all; }
  .w small { display:block; font-size:11px; color:var(--muted); }
  .w.hit { border-color:var(--ok); background:rgba(34,160,90,.12); }
  .turn .res { font-size:13px; margin-top:6px; }
  .res.ok { color:var(--ok); } .res.none { color:var(--muted); }

  .result { text-align:center; }
  .result .big { font-size:22px; font-weight:700; margin-bottom:6px; word-break:break-all; color:var(--ok); }
  .result button { margin-top:12px; width:100%; }
  .center { text-align:center; }
</style>
</head>
<body>
<main>
  <a class="back" id="back" href="../../">← 返回游戏厅</a>
  <h1>🌉 中间词</h1>

  <div id="lobby"></div>
  <div class="role" id="roleLine"></div>

  <div class="card center" id="stateCard" hidden>
    <div id="stateText"></div>
  </div>

  <!-- 比分 -->
  <div class="card" id="scoreCard" hidden>
    <div class="topline"><span id="turnLine"></span><span id="targetLine"></span></div>
    <div class="chips" id="players"></div>
  </div>

  <!-- 输入 -->
  <form class="card" id="guessForm" hidden novalidate>
    <div class="row">
      <input type="text" id="guess" lang="zh-CN" maxlength="8" autocomplete="off" autocapitalize="off"
             spellcheck="false" enterkeyhint="send" placeholder="想一个词，例如：春天">
      <button class="main" type="submit" id="guessBtn">提交</button>
    </div>
    <div class="msg" id="msg" aria-live="polite"></div>
  </form>

  <!-- 已提交，等待其他人 / AI 思考中 -->
  <div class="card wait" id="waitCard" hidden>
    <div id="waitTop"></div>
    <div class="mine" id="waitMine"></div>
    <div class="muted" id="waitSub"></div>
    <button class="ghost" type="button" id="reveal" hidden style="margin-top:10px">现在揭晓（主机）</button>
  </div>

  <!-- 结束 -->
  <div class="card result" id="resultCard" hidden>
    <div class="big" id="resultTitle"></div>
    <div class="muted" id="resultSub"></div>
    <button class="main" type="button" id="again">再来一局</button>
    <div class="muted" id="waitNext" style="margin-top:12px" hidden>等待主机开始下一局…</div>
  </div>

  <!-- 记录 -->
  <div class="card" id="listCard" hidden>
    <div class="muted" style="margin-bottom:4px">每一轮的词（最新在最上面）</div>
    <div id="list"></div>
  </div>

  <div class="card">
    <div class="muted">
      <b>规则</b>：每一轮，你们和 🤖 AI 同时秘密说一个词。揭晓后，只要有两个或更多的"人"说了同一个词（AI 也算一个），说这个词的每个人各得 1 分。
      没有人相同时，AI 会根据场上所有的词想一个"中间词"，当作它下一轮说的词——想想它会说什么，让大家的词越来越接近。
      先到目标分数的赢。这一局里说过的词不能再说。只有你一个人时，就是你和 AI 对玩。
    </div>
  </div>
</main>

<script type="module">
import {CONFIG} from './config.js'
import {createLobby} from '../../shared/lobby.js'
import {chars, cleanGuess, validateWord, pickStarter, validAiWord, groupMatches, MAX_LOG,
        isId, pickLeader, newSid, parseSubmitMsg, parseRes, parseState, isNewer} from './logic.js'

const $ = id => document.getElementById(id)
$('back').href = '../../' + location.search   // 独立打开时，返回时保留 ?s= 参数

// =====================================================================================
// 玩法与联机方式
//   · 房主就是"主机"：持有 AI 的词、收集大家提交的词、揭晓、算分，并负责请求 AI（经 Cloudflare Worker）。
//   · 提交的词在揭晓前只有主机知道，其他人只能看到"谁已经提交了"。AI 的词也一样，揭晓时才公开。
//   · 公共状态每次都发完整的一份并带版本号：晚加入的人、丢了消息的人，收到下一条就追上了。
// =====================================================================================

const blank = () => ({sid: '', v: 0, r: 0, rd: 0, ph: 'prep', turn: 0, tg: CONFIG.TARGET_SCORE, ai: 0, note: '',
                      ids: [], sc: [], sub: [], L: []})
const P = blank()
const resetPublic = () => Object.assign(P, blank())
const stateMsg = () => ({t: 'st', sid: P.sid, v: P.v, r: P.r, rd: P.rd, ph: P.ph, turn: P.turn, tg: P.tg, ai: P.ai, note: P.note,
                         ids: P.ids, sc: P.sc, sub: P.sub, L: P.L})
const applyState = s => Object.assign(P, s)

// 只有主机用的私有状态
const H = {gen: 0, ai: '' /* AI 这一轮要说的词 */, sub: new Map() /* 玩家 id → 词 */, used: new Set() /* 本局已揭晓过的词 */, timer: 0}

// 每个人自己的界面状态
const U = {busy: false, pendingId: -1, timer: 0, seq: 0, msg: '', msgCls: '', sent: null /* {key, word} */}

let room = null, act = null, selfId = null, leader = null, booted = false
const peers = new Set()
const isHost = () => !!selfId && leader === selfId
const nameOf = id => (room && room.names && room.names[id]) || (id === selfId ? '我' : '玩家' + String(id).slice(-4))
const present = () => [selfId, ...peers]
const turnKey = () => P.r + ':' + P.rd + ':' + P.turn

function sendTo(target, msg) {
  if (!act) return
  try { const p = act.send(msg, target ? {target} : undefined); if (p && p.catch) p.catch(() => {}) } catch {}
}
function broadcast() { if (peers.size) sendTo(null, stateMsg()) }
function bump() { P.v++; broadcast(); render() }

// ---------- 向 Worker 要"中间词"（只有主机会调用） ----------
async function askBlend(words, avoid) {
  const ctrl = new AbortController()
  const timer = setTimeout(() => ctrl.abort(), 25000)
  try {
    const body = {words}
    if (avoid.length) body.avoid = avoid
    const res = await fetch(CONFIG.BLEND_URL, {
      method: 'POST', headers: {'Content-Type': 'application/json', 'Accept': 'application/json'}, signal: ctrl.signal,
      body: JSON.stringify(body)
    })
    if (!res.ok) { const e = new Error('HTTP ' + res.status); e.status = res.status; throw e }
    const json = await res.json()
    return json && typeof json.word === 'string' ? json.word : ''
  } finally { clearTimeout(timer) }
}

function explain(e) {
  if (e && e.name === 'AbortError') return '超时'
  const s = e && e.status
  if (s === 429) return '额度限速'
  if (s === 500) return 'Worker 没配置 Key'
  if (s === 422 || s === 404) return 'Worker 还是旧代码'
  if (s === 502) return '没给出可用的词'
  if (e instanceof TypeError) return '网络不通'
  return String(e && e.message || e).slice(0, 20)
}

async function getBlend(words, gen) {
  const avoid = []
  for (let i = 0; i < CONFIG.MAX_TRIES; i++) {
    const mid = await askBlend(words, avoid)
    if (gen !== H.gen || P.ph !== 'think') return ''
    if (validAiWord(mid, H.used)) return mid
    if (/^\p{Script=Han}{1,12}$/u.test(mid)) avoid.push(mid)
  }
  throw Object.assign(new Error('no usable'), {status: 502})
}

// =====================================================================================
// 主机：开局、收词、揭晓
// =====================================================================================
function ensurePlayer(id) {
  let i = P.ids.indexOf(id)
  if (i < 0) { P.ids.push(id); P.sc.push(0); i = P.ids.length - 1 }
  return i
}
const syncSub = () => { P.sub = [...H.sub.keys()].map(id => P.ids.indexOf(id)).filter(i => i >= 0) }

function armTimer() {
  clearTimeout(H.timer)
  H.timer = setTimeout(() => {
    if (!isHost() || P.ph !== 'collect') return
    if (H.sub.size) reveal(); else armTimer()      // 一个人都没提交：不白白请求 AI，继续等
  }, CONFIG.TURN_SECONDS * 1000)
}

// 新的一局（分数清零）
function newGame() {
  if (!isHost()) return
  H.gen++
  clearTimeout(H.timer)
  const keep = {sid: P.sid, v: P.v, r: P.r + 1}
  resetPublic(); Object.assign(P, keep)
  P.rd = 1
  present().forEach(ensurePlayer)
  U.msg = ''; U.msgCls = ''; U.sent = null
  startRound()
}

// 一个新的"词局"：AI 说一个开头的词，大家从零开始往一起靠
function startRound() {
  H.used.clear(); H.sub.clear()
  H.ai = pickStarter([], Math.random)
  P.turn = 1; P.sub = []; P.ph = 'collect'; P.note = ''
  armTimer()
  bump()
  focusGuess()
}

function deliverRes(to, res) {
  if (to === selfId) onRes(parseRes(res))
  else sendTo(to, res)
}

function submitWord(from, id, word) {
  const reject = m => deliverRes(from, {t: 'res', id, ok: false, m})
  if (P.ph !== 'collect') return reject('现在还不能提交，请稍等')
  if (H.sub.has(from)) return reject('你这一轮已经提交过了')
  const bad = validateWord(word)
  if (bad) return reject(bad)
  if (H.used.has(word)) return reject(`「${word}」这一局已经出现过了，换一个吧`)
  ensurePlayer(from)
  H.sub.set(from, word)
  syncSub()
  deliverRes(from, {t: 'res', id, ok: true, m: '已提交'})
  if (present().every(x => H.sub.has(x))) reveal(); else bump()
}

// 揭晓：算相同的词、加分；没人相同就让 AI 想下一轮的词
async function reveal() {
  if (!isHost() || P.ph !== 'collect' || !H.sub.size) return
  clearTimeout(H.timer)
  const gen = ++H.gen
  const entries = [...H.sub].map(([id, w]) => [ensurePlayer(id), w])
  entries.push([-1, H.ai])
  const groups = groupMatches(entries)
  for (const g of groups) for (const who of g.who) { if (who < 0) P.ai++; else P.sc[who]++ }
  P.L.push([P.turn, P.rd, entries, groups.map(g => g.word)])
  while (P.L.length > MAX_LOG) P.L.shift()
  entries.forEach(e => H.used.add(e[1]))
  H.sub.clear(); P.sub = []

  if (Math.max(P.ai, ...P.sc) >= P.tg) { P.ph = 'over'; P.note = ''; bump(); return }
  if (groups.length) { P.rd++; startRound(); return }       // 有人说到一起了：开始新的一个词局

  P.ph = 'think'; P.note = ''
  bump()
  let mid = ''
  try { mid = await getBlend([...new Set(entries.map(e => e[1]))], gen) }
  catch (e) { if (gen !== H.gen) return; P.note = `AI 这次没想出中间词（${explain(e)}），随机换了一个词` }
  if (gen !== H.gen || P.ph !== 'think') return
  if (!mid) mid = pickStarter([...H.used], Math.random)
  H.ai = mid
  P.turn++; P.ph = 'collect'
  armTimer()
  bump()
  focusGuess()
}

// =====================================================================================
// 收到的联机消息（一律当作不可信数据）
// =====================================================================================
function onMsg(d, from) {
  if (!d || typeof d !== 'object' || !isId(from) || from === selfId || !selfId) return
  if (isHost()) {
    if (!peers.has(from)) return
    if (d.t === 'w') { const m = parseSubmitMsg(d); if (m) submitWord(from, m.id, m.w) }
    else if (d.t === 'hi') { if (P.sid) sendTo(from, stateMsg()) }
  } else if (from === leader) {
    if (d.t === 'st') {
      const s = parseState(d)
      if (s && isNewer(P, s)) { applyState(s); render(); focusGuess() }
    } else if (d.t === 'res') onRes(parseRes(d))
  }
}

function onRes(res) {
  if (!res || res.id !== U.pendingId) return
  const key = U.pendingKey, word = U.pendingWord
  cancelPending()
  if (res.ok) { U.sent = {key, word}; U.msg = ''; U.msgCls = ''; $('guess').value = '' }
  else { U.msg = res.m; U.msgCls = 'warn' }
  render()
  focusGuess()
}

function cancelPending() { clearTimeout(U.timer); U.busy = false; U.pendingId = -1 }

// =====================================================================================
// 谁是主机：房主。房主换人（或有人进出）时重新确认
// =====================================================================================
function syncLeader() {
  if (!selfId) return
  const nl = pickLeader(room && room.host, selfId, peers)
  if (nl === leader) return
  leader = nl
  H.gen++; clearTimeout(H.timer); H.sub.clear()
  cancelPending()
  U.msg = ''; U.msgCls = ''; U.sent = null
  resetPublic()
  if (leader === selfId) { P.sid = newSid(); newGame() }       // 我成了主机：新开一局（新的 sid 让别人知道换了主机）
  else if (leader) sendTo(leader, {t: 'hi'})                   // 我不是主机：向主机要当前状态
  render()
}

function onJoin(id) {
  if (!isId(id) || id === selfId || peers.has(id)) return
  peers.add(id)
  if (!selfId) return
  const was = leader
  syncLeader()
  if (isHost() && was === leader && P.sid) { ensurePlayer(id); bump() }   // 有人中途加入：把当前进度发给他
  else render()
}
function onLeave(id) {
  if (!peers.delete(id)) return
  if (!selfId) return
  const was = leader
  syncLeader()
  if (isHost() && was === leader) {
    H.sub.delete(id); syncSub()
    if (P.ph === 'collect' && H.sub.size && present().every(x => H.sub.has(x))) reveal(); else bump()
  } else render()
}

function boot() {
  if (booted) return
  booted = true
  syncLeader()
  render()
  setInterval(() => {
    if (isHost()) { if (peers.size && P.sid) sendTo(null, stateMsg()) }
    else if (leader && !P.sid) sendTo(leader, {t: 'hi'})
  }, 5000)
}
function soloBoot() { if (!selfId) { selfId = 'solo-' + Math.random().toString(36).slice(2, 8); boot() } }

// =====================================================================================
// 操作
// =====================================================================================
function focusGuess() {
  if (P.ph === 'collect' && !mySubmitted() && !U.busy && matchMedia('(pointer:fine)').matches) $('guess').focus({preventScroll: true})
}

function say(text, cls) { U.msg = text; U.msgCls = cls || ''; $('msg').textContent = text; $('msg').className = 'msg ' + (cls || '') }

const meIdx = () => P.ids.indexOf(selfId)
const mySubmitted = () => meIdx() >= 0 && P.sub.includes(meIdx())

function submitGuess() {
  if (P.ph !== 'collect' || U.busy || !leader || mySubmitted()) return
  const word = cleanGuess($('guess').value)
  const bad = validateWord(word)
  if (bad) return say(bad, 'bad')
  const id = ++U.seq
  U.busy = true; U.pendingId = id; U.pendingKey = turnKey(); U.pendingWord = word
  say('', '')
  if (isHost()) submitWord(selfId, id, word)
  else {
    sendTo(leader, {t: 'w', id, w: word})
    U.timer = setTimeout(() => {                    // 主机一直不回：放开输入，让玩家可以重试
      if (U.pendingId !== id) return
      cancelPending(); U.msg = '主机没有响应，请稍后再试'; U.msgCls = 'warn'; render()
    }, 15000)
  }
  render()
}

$('guessForm').onsubmit = e => { e.preventDefault(); submitGuess() }
$('reveal').onclick = () => { if (isHost()) reveal() }
$('again').onclick = () => { if (isHost() && P.ph === 'over') newGame() }

// =====================================================================================
// 画面
// =====================================================================================
const whoName = idx => idx < 0 ? '🤖 AI' : (P.ids[idx] === selfId ? '你' : nameOf(P.ids[idx]))

function render() {
  const host = isHost()
  const ph = P.ph
  const inGame = ph === 'collect' || ph === 'think' || ph === 'over'

  let role = '正在连接…'
  if (selfId && leader) {
    if (host) role = peers.size ? '👑 你是主机：收词、揭晓和请求 AI 都由你的页面完成' : '👑 你是主机：目前只有你一个人，你和 AI 对玩；其他人加入后会一起玩'
    else role = `主机是「${nameOf(leader)}」，AI 由主机代为请求`
  }
  $('roleLine').textContent = role

  $('stateCard').hidden = inGame
  if (!inGame) $('stateText').textContent = host ? '正在准备…' : !P.sid ? (leader ? '正在等待主机…' : '正在连接…') : '主机正在准备…'

  // 比分
  $('scoreCard').hidden = !inGame
  $('turnLine').textContent = P.turn ? `第 ${P.rd} 个词局 · 第 ${P.turn} 轮` : ''
  $('targetLine').textContent = `先到 ${P.tg} 分获胜`
  renderPlayers(inGame)

  // 输入 / 等待
  const submitted = mySubmitted()
  const here = new Set(present())
  const need = P.ids.filter(id => here.has(id)).length || 1
  $('guessForm').hidden = !(ph === 'collect' && !submitted)
  $('guess').disabled = U.busy
  $('guessBtn').disabled = U.busy
  const noteInForm = !U.msg && ph === 'collect' && !submitted && P.note
  $('msg').textContent = U.msg || (noteInForm ? P.note : ''); $('msg').className = 'msg ' + (U.msg ? U.msgCls : noteInForm ? 'warn' : '')

  const waiting = (ph === 'collect' && submitted) || ph === 'think'
  $('waitCard').hidden = !waiting
  if (waiting) {
    if (ph === 'think') {
      $('waitTop').textContent = '揭晓了！AI 正在想中间词…'
      $('waitMine').textContent = ''
      $('waitSub').textContent = ''
    } else {
      $('waitTop').textContent = '你已提交'
      $('waitMine').textContent = U.sent && U.sent.key === turnKey() ? `「${U.sent.word}」` : ''
      $('waitSub').textContent = `已提交 ${P.sub.length}/${need}，等其他人…`
    }
  }
  $('reveal').hidden = !(host && ph === 'collect' && P.sub.length > 0 && P.sub.length < need)
  if (waiting && ph === 'collect' && P.note) $('waitSub').textContent += ' ' + P.note

  // 结果
  $('resultCard').hidden = ph !== 'over'
  if (ph === 'over') {
    const best = Math.max(P.ai, ...P.sc)
    const winners = []
    P.ids.forEach((id, i) => { if (P.sc[i] === best) winners.push(id === selfId ? '你' : nameOf(id)) })
    if (P.ai === best) winners.push('🤖 AI')
    $('resultTitle').textContent = (winners.length === 1 && winners[0] === '🤖 AI') ? '🤖 AI 赢了！' : `🎉 ${winners.join('、')} 赢了！`
    $('resultSub').textContent = `${best} 分 · 共 ${P.L.length} 轮`
  }
  $('again').hidden = !host
  $('waitNext').hidden = host

  $('listCard').hidden = !P.L.length
  renderList()
}

function renderPlayers(show) {
  const box = $('players')
  box.textContent = ''
  if (!show) return
  const here = new Set(present())
  const add = (label, score, me) => {
    const chip = document.createElement('span')
    chip.className = 'chip' + (me ? ' me' : '')
    chip.append(label + ' ')
    const b = document.createElement('b'); b.textContent = score
    chip.appendChild(b)
    box.appendChild(chip)
  }
  const order = P.ids.map((id, i) => i).filter(i => here.has(P.ids[i]))
  order.sort((a, b) => (P.ids[a] === leader ? -1 : 0) - (P.ids[b] === leader ? -1 : 0) || P.sc[b] - P.sc[a])
  for (const i of order) {
    const id = P.ids[i]
    add(`${id === leader ? '👑 ' : ''}${id === selfId ? '你' : nameOf(id)}${P.sub.includes(i) && P.ph === 'collect' ? ' ✓' : ''}`, P.sc[i], id === selfId)
  }
  add('🤖 AI', P.ai, false)
}

function renderList() {
  const box = $('list')
  box.textContent = ''
  const rows = [...P.L].reverse()
  rows.forEach((t, k) => {
    const [turn, rd, entries, hits] = t
    const div = document.createElement('div')
    div.className = 'turn' + (k === 0 ? ' new' : '')
    const head = document.createElement('div'); head.className = 'head'
    head.textContent = `第 ${rd} 个词局 · 第 ${turn} 轮`
    const words = document.createElement('div'); words.className = 'words'
    for (const [who, word] of entries) {
      const w = document.createElement('span'); w.className = 'w' + (hits.includes(word) ? ' hit' : '')
      w.append(word)
      const s = document.createElement('small'); s.textContent = whoName(who)
      w.appendChild(s)
      words.appendChild(w)
    }
    const res = document.createElement('div'); res.className = 'res ' + (hits.length ? 'ok' : 'none')
    res.textContent = hits.length ? `✅ 说到一起了：${hits.map(h => '「' + h + '」').join('、')}，各得 1 分` : '没有人相同，AI 根据这些词想了一个中间词'
    div.append(head, words, res)
    box.appendChild(div)
  })
}

// =====================================================================================
// 启动：通过大厅联机。独立打开时自己建房（扫码）；联机库加载不了就当作单人玩
// =====================================================================================
render()
const lobby = await createLobby({
  gameId: 'middle-word',
  container: $('lobby'),
  maxPlayers: 10,
  onPeerJoin: onJoin,
  onPeerLeave: onLeave,
  setup(r) {
    room = r
    act = r.makeAction('mw')
    act.onMessage((d, meta) => onMsg(d, meta && meta.peerId))
    Promise.resolve(r.getSelf()).then(s => { selfId = s.peerId; boot() }).catch(soloBoot)
  }
})
if (!lobby && !selfId) soloBoot()
</script>
</body>
</html>
